#@TYPE: Machine
#@NAME: Beck IPC SC165 Board on DB15x Baseboard
#@SOC: i.MX6UL
#@DESCRIPTION: Machine configuration for Beck IPC SC165 Board
#@MAINTAINER: Florian Boor <florian@kernelconcepts.de>

include conf/machine/include/sc165.inc

MACHINE_FEATURES += " usbhost usbgadget vfat"

KERNEL_DEVICETREE = "imx6ul-sc165-db150.dtb "

UBOOT_CONFIG ?= "qspi"
UBOOT_ENTRYPOINT:sc165-db150 = "0x80800000"

SERIAL_CONSOLES:sc165-db150 = "115200;ttymxc3"

IMAGE_FSTYPES ?= "ubifs ext4 wic.gz"
EXTRA_IMAGECMD:ext4="-O ^64bit,^casefold,^verity,^stable_inodes,^filetype,^orphan_file"

WKS_FILE = "beck-rootsd.wks.in"
